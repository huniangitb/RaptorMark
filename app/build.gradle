plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'kotlinx-serialization'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "io.github.devriesl.raptormark"
    compileSdk 36

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "io.github.devriesl.raptormark"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 12
        versionName "2.1.2"

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ndkVersion "28.2.13676358"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // Compose compiler is built into Kotlin 2.4.0+
}

kotlin {
    jvmToolchain(17)
}

// Copy fio_runner native executable into APK assets for root execution path
tasks.register('copyFioRunner') {
    dependsOn tasks.matching { it.name.contains("ExternalNativeBuild") || it.name.contains("CMake") }
    doLast {
        // Search for fio_runner in CMake output directories (both intermediates and .cxx)
        def searchDirs = [
            "${buildDir}/intermediates/cmake",
            "${projectDir}/.cxx"
        ]
        searchDirs.each { dir ->
            fileTree(dir: dir, include: "**/fio_runner").each { f ->
                def buildType = "release"
                if (f.absolutePath.contains("relwithdebinfo")) buildType = "release"
                else if (f.absolutePath.contains("debug")) buildType = "debug"
                def destDir = file("${buildDir}/intermediates/assets/${buildType}/bin")
                destDir.mkdirs()
                copy {
                    from f
                    into destDir
                }
                logger.info("fio_runner copied from {} to {}", f, destDir)
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
        dependsOn "copyFioRunner"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.2"

    // Dagger Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // Compose BOM
    def composeBom = platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    // material-icons not needed - using custom vector drawable
    // Compose integration with activities
    implementation "androidx.activity:activity-compose:1.9.3"
    // Integration with ViewModels
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    // Coil
    implementation 'io.coil-kt:coil-compose:2.2.2'
}